# SonarCloud-Konfiguration. projectKey und organization übergibt der Workflow
# (.github/workflows/sonarcloud.yml) zusätzlich als Argumente.
sonar.projectKey=BennyGK15_sng-creator
sonar.organization=esenwein

# Quellcode und Tests getrennt erfassen, damit Tests nicht als Produktivcode zählen
sonar.sources=app,components,lib
sonar.tests=app,components,lib
sonar.test.inclusions=**/__tests__/**,**/*.test.ts,**/*.test.tsx
sonar.exclusions=**/__tests__/**,**/*.test.ts,**/*.test.tsx

# Testabdeckung aus Vitest (pnpm test:coverage)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Abdeckung wird für die Logik gemessen (Import, Export, Spracherkennung, Hilfsfunktionen).
# React-Komponenten und Seiten (*.tsx) werden im Browser geprüft, nicht per Unit-Test;
# reine Konfigurations- bzw. Datendateien enthalten keine testbare Logik.
sonar.coverage.exclusions=**/*.tsx,components/song-form/tour.ts,lib/legal.ts
